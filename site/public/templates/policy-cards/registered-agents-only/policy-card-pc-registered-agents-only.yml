# .github/workflows/policy-card-pc-registered-agents-only.yml: the CI hook of Policy Card
# pc-registered-agents-only version 1.0.0, rule agents.registered-only.v1 (effect: deny; enforced
# at: deploy, runtime).
# Generated by the Policy Card builder, https://aigovernanceengineer.com/toolkit/policy-card
# Illustrative, review before use. Indicative, not legal advice and not a conformity claim.
# Pin the action and OPA versions you have tested; the majors below were current on 2026-09-24.
name: policy-card-pc-registered-agents-only

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
      - name: Check and test the rule
        run: |
          opa check --strict policies/pc-registered-agents-only.rego policies/pc-registered-agents-only_test.rego
          opa test -v policies/pc-registered-agents-only.rego policies/pc-registered-agents-only_test.rego
      - name: Build the input
        # Yours: write the input document the module header describes, from the registry,
        # the eval store or the change itself. A compliant example:
        # policies/pc-registered-agents-only.input.json
        run: ./scripts/policy-input.sh pc-registered-agents-only > policy-input.json
      - name: Record the verdict
        run: |
          opa eval --format raw \
            --data policies/pc-registered-agents-only.rego --input policy-input.json \
            'data.aige.cards.pc_registered_agents_only.verdict' | tee verdict-pc-registered-agents-only.json
      - name: Keep the verdict as evidence
        uses: actions/upload-artifact@v7
        with:
          name: verdict-pc-registered-agents-only
          path: verdict-pc-registered-agents-only.json
      - name: Fail the job on deny
        run: |
          opa eval --format pretty \
            --data policies/pc-registered-agents-only.rego --input policy-input.json \
            'data.aige.cards.pc_registered_agents_only.deny'
          opa eval --fail-defined --format pretty \
            --data policies/pc-registered-agents-only.rego --input policy-input.json \
            'data.aige.cards.pc_registered_agents_only.blocks'
