# .github/workflows/policy-card-pc-model-card-before-release.yml: the CI hook of Policy Card
# pc-model-card-before-release version 1.0.0, rule docs.model-card-present.v1 (effect: deny;
# enforced at: pre_merge, deploy).
# Generated by the Policy Card builder, https://aigovernanceengineer.com/toolkit/policy-card
# Illustrative, review before use. Indicative, not legal advice and not a conformity claim.
# Pin the action and OPA versions you have tested; the majors below were current on 2026-09-24.
name: policy-card-pc-model-card-before-release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
      - name: Check and test the rule
        run: |
          opa check --strict policies/pc-model-card-before-release.rego policies/pc-model-card-before-release_test.rego
          opa test -v policies/pc-model-card-before-release.rego policies/pc-model-card-before-release_test.rego
      - name: Build the input
        # Yours: write the input document the module header describes, from the registry,
        # the eval store or the change itself. A compliant example:
        # policies/pc-model-card-before-release.input.json
        run: ./scripts/policy-input.sh pc-model-card-before-release > policy-input.json
      - name: Record the verdict
        run: |
          opa eval --format raw \
            --data policies/pc-model-card-before-release.rego --input policy-input.json \
            'data.aige.cards.pc_model_card_before_release.verdict' | tee verdict-pc-model-card-before-release.json
      - name: Keep the verdict as evidence
        uses: actions/upload-artifact@v7
        with:
          name: verdict-pc-model-card-before-release
          path: verdict-pc-model-card-before-release.json
      - name: Fail the job on deny
        run: |
          opa eval --format pretty \
            --data policies/pc-model-card-before-release.rego --input policy-input.json \
            'data.aige.cards.pc_model_card_before_release.deny'
          opa eval --fail-defined --format pretty \
            --data policies/pc-model-card-before-release.rego --input policy-input.json \
            'data.aige.cards.pc_model_card_before_release.blocks'
