# .github/workflows/policy-card-pc-eval-score-gate.yml: the CI hook of Policy Card
# pc-eval-score-gate version 1.0.0, rule evals.min-score.v1 (effect: deny; enforced at: pre_merge,
# deploy).
# Generated by the Policy Card builder, https://aigovernanceengineer.com/toolkit/policy-card
# Illustrative, review before use. Indicative, not legal advice and not a conformity claim.
# Pin the action and OPA versions you have tested; the majors below were current on 2026-09-24.
name: policy-card-pc-eval-score-gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
      - name: Check and test the rule
        run: |
          opa check --strict policies/pc-eval-score-gate.rego policies/pc-eval-score-gate_test.rego
          opa test -v policies/pc-eval-score-gate.rego policies/pc-eval-score-gate_test.rego
      - name: Build the input
        # Yours: write the input document the module header describes, from the registry,
        # the eval store or the change itself. A compliant example:
        # policies/pc-eval-score-gate.input.json
        run: ./scripts/policy-input.sh pc-eval-score-gate > policy-input.json
      - name: Record the verdict
        run: |
          opa eval --format raw \
            --data policies/pc-eval-score-gate.rego --input policy-input.json \
            'data.aige.cards.pc_eval_score_gate.verdict' | tee verdict-pc-eval-score-gate.json
      - name: Keep the verdict as evidence
        uses: actions/upload-artifact@v7
        with:
          name: verdict-pc-eval-score-gate
          path: verdict-pc-eval-score-gate.json
      - name: Fail the job on deny
        run: |
          opa eval --format pretty \
            --data policies/pc-eval-score-gate.rego --input policy-input.json \
            'data.aige.cards.pc_eval_score_gate.deny'
          opa eval --fail-defined --format pretty \
            --data policies/pc-eval-score-gate.rego --input policy-input.json \
            'data.aige.cards.pc_eval_score_gate.blocks'
