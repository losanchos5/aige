# .github/workflows/policy-card-pc-no-personal-data-external.yml: the CI hook of Policy Card
# pc-no-personal-data-external version 1.0.0, rule data.no-personal-data-external.v1 (effect: deny;
# enforced at: runtime).
# Generated by the Policy Card builder, https://aigovernanceengineer.com/toolkit/policy-card
# Illustrative, review before use. Indicative, not legal advice and not a conformity claim.
# Pin the action and OPA versions you have tested; the majors below were current on 2026-09-24.
#
# This rule is enforced at runtime: the gateway or guardrail asks OPA for the verdict on every
# call, for example with the REST API
#   POST /v1/data/aige/cards/pc_no_personal_data_external/verdict   {"input": <the request>}
# and acts on its decision. CI checks and tests the module, so a rule change ships as a reviewed,
# tested diff.
name: policy-card-pc-no-personal-data-external

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
      - name: Check and test the rule
        run: |
          opa check --strict policies/pc-no-personal-data-external.rego policies/pc-no-personal-data-external_test.rego
          opa test -v policies/pc-no-personal-data-external.rego policies/pc-no-personal-data-external_test.rego
