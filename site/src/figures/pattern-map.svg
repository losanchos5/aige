  <a href="#pattern-continuous-assurance-telemetry">
    <rect class="l5-bg" x="16" y="524" width="235" height="24" rx="6"/>
    <text class="l5-tx" x="26" y="541" font-size="13.5">Continuous Assurance Telemetry</text>
  </a>
  <a href="#pattern-incident-pipeline">
    <rect class="l5-bg" x="16" y="554" width="142" height="24" rx="6"/>
    <text class="l5-tx" x="26" y="571" font-size="13.5">Incident Pipeline</text>
  </a>
  <a href="#pattern-machine-readable-evidence-oscal">
    <rect class="l5-bg" x="16" y="584" width="257" height="24" rx="6"/>
    <text class="l5-tx" x="26" y="601" font-size="13.5">Machine-Readable Evidence (OSCAL)</text>
  </a>
</svg>
