  <title id="fig-eu-ai-act-timeline-t">EU AI Act timeline, post-Omnibus</title>
  <desc id="fig-eu-ai-act-timeline-d">Seven lanes of EU AI Act obligation families on one time axis, 2024 to 2030, with the Omnibus in force from 2026-07-27 and the deferred high-risk dates.</desc>
