<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 448" class="figc" role="img" aria-labelledby="fig-profession-in-numbers-t fig-profession-in-numbers-d">
  <title id="fig-profession-in-numbers-t">The profession in numbers</title>
  <desc id="fig-profession-in-numbers-d">Demand for AI governance is near-universal (77% of organisations, roughly nine in ten of those using AI, and only 1.5% expecting no new staff), and the postings ask for observability, Python and NIST frameworks.</desc>

  <text class="mono muted" x="16" y="20" font-size="13.5">Demand, and the skills it asks for</text>

  <!-- Demand: IAPP 2025 report -->
  <rect class="panel" x="8" y="34" width="344" height="192" rx="10"/>
  <text class="disp" x="20" y="56" font-size="14.5">Demand · IAPP 2025 report</text>
  <text class="disp" x="20" y="98" font-size="26">77%</text>
  <text class="ink2" x="124" y="84" font-size="13.5">of organisations report</text>
  <text class="ink2" x="124" y="102" font-size="13.5">working on AI governance</text>
  <line class="rule" x1="20" y1="114" x2="340" y2="114"/>
  <text class="disp" x="20" y="146" font-size="22">9 in 10</text>
  <text class="ink2" x="124" y="134" font-size="13.5">roughly, among those</text>
  <text class="ink2" x="124" y="152" font-size="13.5">already using AI</text>
  <line class="rule" x1="20" y1="164" x2="340" y2="164"/>
  <text class="disp" x="20" y="200" font-size="26">1.5%</text>
  <text class="ink2" x="124" y="184" font-size="13.5">10 of 671 respondents will</text>
  <text class="ink2" x="124" y="202" font-size="13.5">not need more AI governance</text>
  <text class="ink2" x="124" y="220" font-size="13.5">staff in the next 12 months</text>

  <!-- Skills: share of US AI-governance postings -->
  <rect class="panel" x="8" y="238" width="344" height="176" rx="10"/>
  <text class="disp" x="20" y="260" font-size="14.5">Skills · 1,997 US postings, Aug 2026</text>
  <text class="ink2" x="20" y="280" font-size="13">Share of postings asking for each skill</text>
  <line class="rule" x1="20" y1="290" x2="20" y2="404"/>
  <text x="28" y="306" font-size="13.5">Observability platforms</text>
  <rect class="glyph-fill" x="20" y="313" width="123" height="14" rx="2"/>
  <text class="mono" x="151" y="325" font-size="13">41%</text>
  <text x="28" y="346" font-size="13.5">Python</text>
  <rect class="glyph-fill" x="20" y="353" width="84" height="14" rx="2"/>
  <text class="mono" x="112" y="365" font-size="13">28%</text>
  <text x="28" y="386" font-size="13.5">NIST frameworks</text>
  <rect class="glyph-fill" x="20" y="393" width="81" height="14" rx="2"/>
  <text class="mono" x="109" y="405" font-size="13">27%</text>

  <text class="ink2" x="16" y="438" font-size="13.5">Build-and-run skills, not review skills.</text>
</svg>
