  <title id="fig-eu-ai-act-timeline-es-t" lang="en">EU AI Act timeline, in Spanish</title>
  <desc id="fig-eu-ai-act-timeline-es-d" lang="en">Spanish edition: seven lanes of EU AI Act obligation families on one time axis, 2024 to 2030, with the Omnibus in force from 2026-07-27.</desc>
  <text class="mono muted" x="40" y="56" font-size="17">Reglamento (UE) 2024/1689, modificado por el Reglamento (UE) 2026/1744</text>
