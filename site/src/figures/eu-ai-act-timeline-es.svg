  <text class="ink2" x="40" y="146" font-size="19">Un carril por familia de obligaciones sobre un mismo eje temporal, con los cambios del Ómnibus</text>
  <text class="ink2" x="40" y="172" font-size="19">digital en vigor desde 2026-07-27.</text>
