<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 494" class="figc" role="img" aria-labelledby="fig-maturity-grid-t fig-maturity-grid-d">
  <title id="fig-maturity-grid-t">The maturity grid</title>
  <desc id="fig-maturity-grid-d">A five-by-five grid of stack layers against maturity levels, with an illustrative profile whose weakest layer sets the overall level.</desc>
  <text class="mono muted" x="16" y="18" font-size="13.5">Your level is the weakest layer</text>
  <text class="mono muted" x="16" y="36" font-size="13">Illustrative fill</text>
  <rect x="103" y="64" width="52" height="192" rx="6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text class="mono muted" x="75" y="58" font-size="13.5" text-anchor="middle">1</text>
  <text class="mono muted" x="129" y="58" font-size="13.5" text-anchor="middle">2</text>
  <text class="mono muted" x="183" y="58" font-size="13.5" text-anchor="middle">3</text>
  <text class="mono muted" x="237" y="58" font-size="13.5" text-anchor="middle">4</text>
  <text class="mono muted" x="291" y="58" font-size="13.5" text-anchor="middle">5</text>
  <text class="mono" x="129" y="268" font-size="13" text-anchor="middle">overall</text>
  <text class="mono" x="30" y="90" font-size="13.5" text-anchor="middle">01</text>
  <rect class="l1-bg cell" x="52" y="70" width="46" height="30" rx="3"/>
  <rect class="l1-bg cell" x="106" y="70" width="46" height="30" rx="3"/>
  <rect class="l1-bg cell" x="160" y="70" width="46" height="30" rx="3"/>
  <rect class="l1-bg cell" x="214" y="70" width="46" height="30" rx="3"/>
  <rect class="l1-st" x="214" y="70" width="46" height="30" rx="3" fill="none" stroke-width="2"/>
  <rect class="cell-empty cell" x="268" y="70" width="46" height="30" rx="3"/>
  <text class="mono" x="30" y="128" font-size="13.5" text-anchor="middle">02</text>
  <rect class="l2-bg cell" x="52" y="108" width="46" height="30" rx="3"/>
  <rect class="l2-bg cell" x="106" y="108" width="46" height="30" rx="3"/>
  <rect class="l2-bg cell" x="160" y="108" width="46" height="30" rx="3"/>
  <rect class="l2-bg cell" x="214" y="108" width="46" height="30" rx="3"/>
  <rect class="l2-st" x="214" y="108" width="46" height="30" rx="3" fill="none" stroke-width="2"/>
  <rect class="cell-empty cell" x="268" y="108" width="46" height="30" rx="3"/>
  <text class="mono" x="30" y="166" font-size="13.5" text-anchor="middle">03</text>
  <rect class="l3-bg cell" x="52" y="146" width="46" height="30" rx="3"/>
  <rect class="l3-bg cell" x="106" y="146" width="46" height="30" rx="3"/>
  <rect class="l3-st" x="106" y="146" width="46" height="30" rx="3" fill="none" stroke-width="2"/>
  <rect class="cell-empty cell" x="160" y="146" width="46" height="30" rx="3"/>
  <rect class="cell-empty cell" x="214" y="146" width="46" height="30" rx="3"/>
  <rect class="cell-empty cell" x="268" y="146" width="46" height="30" rx="3"/>
  <text class="mono" x="30" y="204" font-size="13.5" text-anchor="middle">04</text>
  <rect class="l4-bg cell" x="52" y="184" width="46" height="30" rx="3"/>
  <rect class="l4-bg cell" x="106" y="184" width="46" height="30" rx="3"/>
  <rect class="l4-bg cell" x="160" y="184" width="46" height="30" rx="3"/>
  <rect class="l4-bg cell" x="214" y="184" width="46" height="30" rx="3"/>
  <rect class="l4-st" x="214" y="184" width="46" height="30" rx="3" fill="none" stroke-width="2"/>
  <rect class="cell-empty cell" x="268" y="184" width="46" height="30" rx="3"/>
  <text class="mono" x="30" y="242" font-size="13.5" text-anchor="middle">05</text>
  <rect class="l5-bg cell" x="52" y="222" width="46" height="30" rx="3"/>
  <rect class="l5-bg cell" x="106" y="222" width="46" height="30" rx="3"/>
  <rect class="l5-bg cell" x="160" y="222" width="46" height="30" rx="3"/>
  <rect class="l5-st" x="160" y="222" width="46" height="30" rx="3" fill="none" stroke-width="2"/>
  <rect class="cell-empty cell" x="214" y="222" width="46" height="30" rx="3"/>
  <rect class="cell-empty cell" x="268" y="222" width="46" height="30" rx="3"/>
  <text class="disp" x="16" y="292" font-size="14.5">Overall = Level 2 · Inventoried</text>
  <text class="ink2" x="16" y="310" font-size="13">The weakest layer sets the level; assess each</text>
  <text class="ink2" x="16" y="328" font-size="13">layer, then read the floor.</text>
  <text class="mono muted" x="16" y="354" font-size="13">1 Documented   2 Inventoried   3 Tested</text>
  <text class="mono muted" x="16" y="372" font-size="13">4 Enforced   5 Continuous</text>
  <rect class="l1-bg" x="16" y="393" width="12" height="12" rx="2"/>
  <text class="ink2 mono" x="34" y="404" font-size="13">01 Govern-as-Code</text>
  <rect class="l2-bg" x="16" y="413" width="12" height="12" rx="2"/>
  <text class="ink2 mono" x="34" y="424" font-size="13">02 Inventory &amp; Transparency</text>
  <rect class="l3-bg" x="16" y="433" width="12" height="12" rx="2"/>
  <text class="ink2 mono" x="34" y="444" font-size="13">03 Evals &amp; Red Teaming as Evidence</text>
  <rect class="l4-bg" x="16" y="453" width="12" height="12" rx="2"/>
  <text class="ink2 mono" x="34" y="464" font-size="13">04 Runtime Controls &amp; Observability</text>
  <rect class="l5-bg" x="16" y="473" width="12" height="12" rx="2"/>
  <text class="ink2 mono" x="34" y="484" font-size="13">05 Assurance &amp; Continuous Compliance</text>
</svg>
