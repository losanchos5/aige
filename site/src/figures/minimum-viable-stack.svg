<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" class="figc" role="img" aria-labelledby="fig-mvs-t fig-mvs-d">
  <title id="fig-mvs-t">The minimum viable stack</title>
  <desc id="fig-mvs-d">Five ordered steps — see it, rule it, test it, contain it, prove it — one per stack layer, chained top to bottom.</desc>

  <text class="mono muted" x="16" y="20" font-size="13.5">One vertical slice, every layer</text>

  <!-- Build-order rail, top to bottom -->
  <line class="rule" x1="26" y1="54" x2="26" y2="452" stroke-width="1.5"/>
  <path class="arrow" d="M20 452 h12 l-6 9 z"/>

  <!-- Step 1 — See it — Layer 02 -->
  <circle class="l2-band" cx="26" cy="54" r="13" stroke-width="1.5"/>
  <text class="mono" x="26" y="59" font-size="13.5" text-anchor="middle">1</text>
  <text class="disp" x="50" y="46" font-size="15.5">See it</text>
  <rect class="l2-bg" x="50" y="54" width="243" height="22" rx="5"/>
  <text class="l2-tx" x="60" y="69" font-size="13.5">Layer 02 Inventory &amp; Transparency</text>
  <text class="ink2" x="50" y="92" font-size="13.5">A registry a deploy writes to</text>
  <line class="rule" x1="50" y1="106" x2="350" y2="106"/>

  <!-- Step 2 — Rule it — Layer 01 -->
  <circle class="l1-band" cx="26" cy="142" r="13" stroke-width="1.5"/>
  <text class="mono" x="26" y="147" font-size="13.5" text-anchor="middle">2</text>
  <text class="disp" x="50" y="134" font-size="15.5">Rule it</text>
  <rect class="l1-bg" x="50" y="142" width="175" height="22" rx="5"/>
  <text class="l1-tx" x="60" y="157" font-size="13.5">Layer 01 Govern-as-Code</text>
  <text class="ink2" x="50" y="180" font-size="13.5">One policy with teeth</text>
  <line class="rule" x1="50" y1="194" x2="350" y2="194"/>

  <!-- Step 3 — Test it — Layer 03 -->
  <circle class="l3-band" cx="26" cy="230" r="13" stroke-width="1.5"/>
  <text class="mono" x="26" y="235" font-size="13.5" text-anchor="middle">3</text>
  <text class="disp" x="50" y="222" font-size="15.5">Test it</text>
  <rect class="l3-bg" x="50" y="230" width="290" height="22" rx="5"/>
  <text class="l3-tx" x="60" y="245" font-size="13.5">Layer 03 Evals &amp; Red Teaming as Evidence</text>
  <text class="ink2" x="50" y="268" font-size="13.5">One adversarial eval gate</text>
  <line class="rule" x1="50" y1="282" x2="350" y2="282"/>

  <!-- Step 4 — Contain it — Layer 04 -->
  <circle class="l4-band" cx="26" cy="318" r="13" stroke-width="1.5"/>
  <text class="mono" x="26" y="323" font-size="13.5" text-anchor="middle">4</text>
  <text class="disp" x="50" y="310" font-size="15.5">Contain it</text>
  <rect class="l4-bg" x="50" y="318" width="298" height="22" rx="5"/>
  <text class="l4-tx" x="60" y="333" font-size="13.5">Layer 04 Runtime Controls &amp; Observability</text>
  <text class="ink2" x="50" y="356" font-size="13.5">Identity and a tested kill switch</text>
  <line class="rule" x1="50" y1="370" x2="350" y2="370"/>

  <!-- Step 5 — Prove it — Layer 05 -->
  <circle class="l5-band" cx="26" cy="406" r="13" stroke-width="1.5"/>
  <text class="mono" x="26" y="411" font-size="13.5" text-anchor="middle">5</text>
  <text class="disp" x="50" y="398" font-size="15.5">Prove it</text>
  <rect class="l5-bg" x="50" y="406" width="305" height="22" rx="5"/>
  <text class="l5-tx" x="60" y="421" font-size="13.5">Layer 05 Assurance &amp; Continuous Compliance</text>
  <text class="ink2" x="50" y="444" font-size="13.5">Evidence as a by-product</text>
</svg>
