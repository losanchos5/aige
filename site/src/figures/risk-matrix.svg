<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 528" class="figc" role="img" aria-labelledby="fig-risk-matrix-t fig-risk-matrix-d">
  <title id="fig-risk-matrix-t">The matrix and the S5 override</title>
  <desc id="fig-risk-matrix-d">A five-by-five likelihood-by-severity matrix with Low, Medium, High and Critical bands, the catastrophic severity row on its own track as Critical at any likelihood, and the gate and acceptor for each band.</desc>

  <text class="mono muted" x="16" y="20" font-size="13.5">Illustrative scales and bands</text>

  <!-- Likelihood columns -->
  <text class="mono muted" x="76" y="50" font-size="13" text-anchor="middle">L1</text>
  <text class="mono muted" x="136" y="50" font-size="13" text-anchor="middle">L2</text>
  <text class="mono muted" x="196" y="50" font-size="13" text-anchor="middle">L3</text>
  <text class="mono muted" x="256" y="50" font-size="13" text-anchor="middle">L4</text>
  <text class="mono muted" x="316" y="50" font-size="13" text-anchor="middle">L5</text>

  <!-- S5 runs on its own track: Critical whatever the likelihood -->
  <text class="mono" x="16" y="78" font-size="13">S5</text>
  <rect class="glyph-fill" x="48" y="58" width="296" height="30" rx="4"/>
  <text x="196" y="78" font-size="13.5" text-anchor="middle" class="on-ink">Critical at any likelihood</text>

  <!-- S4 to S1: the matrix bands -->
  <text class="mono" x="16" y="120" font-size="13">S4</text>
  <rect fill="currentColor" fill-opacity="0.14" x="48" y="100" width="56" height="30" rx="3"/>
  <text x="76" y="120" font-size="13" text-anchor="middle">Medium</text>
  <rect fill="currentColor" fill-opacity="0.32" x="108" y="100" width="56" height="30" rx="3"/>
  <text x="136" y="120" font-size="13" text-anchor="middle">High</text>
  <rect fill="currentColor" fill-opacity="0.32" x="168" y="100" width="56" height="30" rx="3"/>
  <text x="196" y="120" font-size="13" text-anchor="middle">High</text>
  <rect class="glyph-fill" x="228" y="100" width="56" height="30" rx="3"/>
  <text x="256" y="120" font-size="13" text-anchor="middle" class="on-ink">Critical</text>
  <rect class="glyph-fill" x="288" y="100" width="56" height="30" rx="3"/>
  <text x="316" y="120" font-size="13" text-anchor="middle" class="on-ink">Critical</text>
  <text class="mono" x="16" y="154" font-size="13">S3</text>
  <rect class="cell-empty cell" x="48" y="134" width="56" height="30" rx="3"/>
  <text x="76" y="154" font-size="13" text-anchor="middle">Low</text>
  <rect fill="currentColor" fill-opacity="0.14" x="108" y="134" width="56" height="30" rx="3"/>
  <text x="136" y="154" font-size="13" text-anchor="middle">Medium</text>
  <rect fill="currentColor" fill-opacity="0.32" x="168" y="134" width="56" height="30" rx="3"/>
  <text x="196" y="154" font-size="13" text-anchor="middle">High</text>
  <rect fill="currentColor" fill-opacity="0.32" x="228" y="134" width="56" height="30" rx="3"/>
  <text x="256" y="154" font-size="13" text-anchor="middle">High</text>
  <rect class="glyph-fill" x="288" y="134" width="56" height="30" rx="3"/>
  <text x="316" y="154" font-size="13" text-anchor="middle" class="on-ink">Critical</text>
  <text class="mono" x="16" y="188" font-size="13">S2</text>
  <rect class="cell-empty cell" x="48" y="168" width="56" height="30" rx="3"/>
  <text x="76" y="188" font-size="13" text-anchor="middle">Low</text>
  <rect class="cell-empty cell" x="108" y="168" width="56" height="30" rx="3"/>
  <text x="136" y="188" font-size="13" text-anchor="middle">Low</text>
  <rect fill="currentColor" fill-opacity="0.14" x="168" y="168" width="56" height="30" rx="3"/>
  <text x="196" y="188" font-size="13" text-anchor="middle">Medium</text>
  <rect fill="currentColor" fill-opacity="0.14" x="228" y="168" width="56" height="30" rx="3"/>
  <text x="256" y="188" font-size="13" text-anchor="middle">Medium</text>
  <rect fill="currentColor" fill-opacity="0.32" x="288" y="168" width="56" height="30" rx="3"/>
  <text x="316" y="188" font-size="13" text-anchor="middle">High</text>
  <text class="mono" x="16" y="222" font-size="13">S1</text>
  <rect class="cell-empty cell" x="48" y="202" width="56" height="30" rx="3"/>
  <text x="76" y="222" font-size="13" text-anchor="middle">Low</text>
  <rect class="cell-empty cell" x="108" y="202" width="56" height="30" rx="3"/>
  <text x="136" y="222" font-size="13" text-anchor="middle">Low</text>
  <rect class="cell-empty cell" x="168" y="202" width="56" height="30" rx="3"/>
  <text x="196" y="222" font-size="13" text-anchor="middle">Low</text>
  <rect fill="currentColor" fill-opacity="0.14" x="228" y="202" width="56" height="30" rx="3"/>
  <text x="256" y="222" font-size="13" text-anchor="middle">Medium</text>
  <rect fill="currentColor" fill-opacity="0.14" x="288" y="202" width="56" height="30" rx="3"/>
  <text x="316" y="222" font-size="13" text-anchor="middle">Medium</text>

  <!-- Scales -->
  <text class="mono muted" x="16" y="256" font-size="13">L1 Rare · L2 Unlikely · L3 Possible</text>
  <text class="mono muted" x="16" y="274" font-size="13">L4 Likely · L5 Almost certain</text>
  <text class="mono muted" x="16" y="296" font-size="13">S1 Negligible · S2 Minor · S3 Moderate</text>
  <text class="mono muted" x="16" y="314" font-size="13">S4 Major · S5 Catastrophic</text>

  <!-- What each band triggers: gate and who may accept -->
  <text class="disp" x="16" y="344" font-size="14.5">What each band triggers</text>
  <rect class="cell-empty cell" x="16" y="358" width="18" height="18" rx="3"/>
  <text class="disp" x="44" y="372" font-size="13.5">Low</text>
  <text x="124" y="370" font-size="13">Registry entry and owner</text>
  <text class="ink2" x="124" y="388" font-size="13">Accept: system owner</text>
  <rect fill="currentColor" fill-opacity="0.14" x="16" y="400" width="18" height="18" rx="3"/>
  <text class="disp" x="44" y="414" font-size="13.5">Medium</text>
  <text x="124" y="412" font-size="13">Eval gate on the linked risk</text>
  <text class="ink2" x="124" y="430" font-size="13">Accept: product owner</text>
  <rect fill="currentColor" fill-opacity="0.32" x="16" y="442" width="18" height="18" rx="3"/>
  <text class="disp" x="44" y="456" font-size="13.5">High</text>
  <text x="124" y="454" font-size="13">Eval gate and runtime guardrail</text>
  <text class="ink2" x="124" y="472" font-size="13">Accept: risk committee</text>
  <rect class="glyph-fill" x="16" y="484" width="18" height="18" rx="3"/>
  <text class="disp" x="44" y="498" font-size="13.5">Critical</text>
  <text x="124" y="496" font-size="13">Deploy denied</text>
  <text class="ink2" x="124" y="514" font-size="13">Accept: governing body, or no one</text>
</svg>
