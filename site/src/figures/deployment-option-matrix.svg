  <text x="342.8" y="1056" font-size="17">Agent identity,</text>
  <text x="342.8" y="1077" font-size="17">tool mediation,</text>
  <text x="342.8" y="1098" font-size="17">kill switch</text>
  <rect class="panel" x="491.6" y="1031" width="150.8" height="129" rx="5"/>
  <text x="501.6" y="1056" font-size="17">Screen and</text>
  <text x="501.6" y="1077" font-size="17">voice actions</text>
  <text x="501.6" y="1098" font-size="17">behind a human</text>
  <text x="501.6" y="1119" font-size="17">gate</text>
  <rect class="panel" x="650.4" y="1031" width="150.8" height="129" rx="5"/>
  <text x="660.4" y="1056" font-size="17">Grant scoped</text>
  <text x="660.4" y="1077" font-size="17">tools; the</text>
  <text x="660.4" y="1098" font-size="17">vendor agent</text>
  <text x="660.4" y="1119" font-size="17">gets its own</text>
  <text x="660.4" y="1140" font-size="17">identity</text>
  <rect class="panel" x="809.2" y="1031" width="150.8" height="129" rx="5"/>
  <text x="819.2" y="1056" font-size="17">Own guardrails</text>
  <text x="819.2" y="1077" font-size="17">end to end; no</text>
  <text x="819.2" y="1098" font-size="17">vendor safety</text>
  <text x="819.2" y="1119" font-size="17">layer</text>
  <line class="rule" x1="40" y1="1168" x2="960" y2="1168"/>
  <text class="ink2" x="40" y="1194" font-size="16">Model types run across and deployment options down: the chapter prints the same matrix turned a quarter. Hybrid</text>
  <text class="ink2" x="40" y="1215" font-size="16">hosting, prompting only and distillation have their own rows in the chapter tables, not a cell here.</text>
  <line class="rule" x1="40" y1="1332" x2="960" y2="1332"/>
  <text class="mono muted" x="40" y="1357" font-size="16">Source: chapter 15, Governing deployment and use: The model-type by deployment-option matrix.</text>
