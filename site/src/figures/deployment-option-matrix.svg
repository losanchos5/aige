  <text x="342.8" y="508" font-size="17">Own guardrails,</text>
  <text x="342.8" y="529" font-size="17">patching and</text>
  <text x="342.8" y="550" font-size="17">energy metering</text>
  <rect class="panel" x="491.6" y="483" width="150.8" height="108" rx="5"/>
  <text x="501.6" y="508" font-size="17">Own content</text>
  <text x="501.6" y="529" font-size="17">signing; media</text>
  <text x="501.6" y="550" font-size="17">retention rules</text>
  <rect class="panel" x="650.4" y="483" width="150.8" height="108" rx="5"/>
  <text x="660.4" y="508" font-size="17">Vendor</text>
  <text x="660.4" y="529" font-size="17">appliance:</text>
  <text x="660.4" y="550" font-size="17">attest version</text>
  <text x="660.4" y="571" font-size="17">and update path</text>
  <rect class="panel" x="809.2" y="483" width="150.8" height="108" rx="5"/>
  <text x="819.2" y="508" font-size="17">You own</text>
  <text x="819.2" y="529" font-size="17">patching:</text>
  <text x="819.2" y="550" font-size="17">AIBOM, file</text>
  <text x="819.2" y="571" font-size="17">scans, red team</text>
  <text class="disp" x="40" y="625" font-size="18">Edge</text>
  <rect class="panel" x="174" y="599" width="150.8" height="129" rx="5"/>
  <text x="184" y="624" font-size="17">Signed model;</text>
  <text x="184" y="645" font-size="17">field-version</text>
  <text x="184" y="666" font-size="17">telemetry;</text>
  <text x="184" y="687" font-size="17">remote rollback</text>
