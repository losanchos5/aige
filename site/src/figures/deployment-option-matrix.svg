<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1414" class="figc" role="img" aria-labelledby="fig-deployment-option-matrix-t fig-deployment-option-matrix-d">
  <title id="fig-deployment-option-matrix-t">Model type by deployment option</title>
  <desc id="fig-deployment-option-matrix-d">A grid of five model types across and six deployment options down, each cell naming the one control that combination adds on top of its row and column.</desc>
  <text class="mono muted" x="40" y="56" font-size="17">Chapter 15 · Governing deployment and use</text>
  <text class="disp" x="40" y="108" font-size="40">What each combination adds</text>
  <text class="ink2" x="40" y="146" font-size="19">Read each cell as the one control the combination adds on top of its row and its column. Illustrative,</text>
  <text class="ink2" x="40" y="172" font-size="19">not a claim of conformity: the controls a real deployment needs follow from its risk tier, its obligations</text>
  <text class="ink2" x="40" y="198" font-size="19">and its failure modes.</text>
  <line class="rule" x1="40" y1="222" x2="960" y2="222"/>
  <text class="mono muted" x="40" y="258" font-size="16">Model type</text>
  <text class="disp" x="174" y="258" font-size="18">Classic</text>
  <text class="disp" x="174" y="280" font-size="18">predictive</text>
  <text class="disp" x="332.8" y="258" font-size="18">Generative,</text>
  <text class="disp" x="332.8" y="280" font-size="18">language</text>
  <text class="disp" x="491.6" y="258" font-size="18">Generative,</text>
  <text class="disp" x="491.6" y="280" font-size="18">multimodal</text>
  <text class="disp" x="650.4" y="258" font-size="18">Proprietary</text>
  <text class="disp" x="650.4" y="280" font-size="18">(API)</text>
  <text class="disp" x="809.2" y="258" font-size="18">Open-weight</text>
  <text class="mono muted" x="40" y="326" font-size="16">Where it runs</text>
  <line class="axis" x1="40" y1="335" x2="960" y2="335"/>
  <text class="disp" x="40" y="372" font-size="18">Cloud</text>
  <rect class="panel" x="174" y="346" width="150.8" height="129" rx="5"/>
  <text x="184" y="371" font-size="17">Residency</text>
  <text x="184" y="392" font-size="17">check on</text>
  <text x="184" y="413" font-size="17">features; input</text>
  <text x="184" y="434" font-size="17">drift monitor</text>
  <rect class="panel" x="332.8" y="346" width="150.8" height="129" rx="5"/>
  <text x="342.8" y="371" font-size="17">No-training and</text>
  <text x="342.8" y="392" font-size="17">retention terms;</text>
  <text x="342.8" y="413" font-size="17">output guardrail</text>
  <rect class="panel" x="491.6" y="346" width="150.8" height="129" rx="5"/>
  <text x="501.6" y="371" font-size="17">Provenance</text>
  <text x="501.6" y="392" font-size="17">marks on</text>
  <text x="501.6" y="413" font-size="17">output;</text>
  <text x="501.6" y="434" font-size="17">biometric-use</text>
  <text x="501.6" y="455" font-size="17">block</text>
  <rect class="panel" x="650.4" y="346" width="150.8" height="129" rx="5"/>
  <text x="660.4" y="371" font-size="17">Pin the version;</text>
  <text x="660.4" y="392" font-size="17">boundary evals</text>
  <text x="660.4" y="413" font-size="17">on every</text>
  <text x="660.4" y="434" font-size="17">change</text>
  <rect class="panel" x="809.2" y="346" width="150.8" height="129" rx="5"/>
  <text x="819.2" y="371" font-size="17">Licence gate;</text>
  <text x="819.2" y="392" font-size="17">hash-verified</text>
  <text x="819.2" y="413" font-size="17">weights on</text>
  <text x="819.2" y="434" font-size="17">rented compute</text>
  <text class="disp" x="40" y="509" font-size="18">On-premise</text>
  <rect class="panel" x="174" y="483" width="150.8" height="108" rx="5"/>
  <text x="184" y="508" font-size="17">Own the</text>
  <text x="184" y="529" font-size="17">retraining</text>
  <text x="184" y="550" font-size="17">pipeline and its</text>
  <text x="184" y="571" font-size="17">approval</text>
