  <text x="342.8" y="624" font-size="17">Small model;</text>
  <text x="342.8" y="645" font-size="17">offline</text>
  <text x="342.8" y="666" font-size="17">guardrails;</text>
  <text x="342.8" y="687" font-size="17">signed updates</text>
  <rect class="panel" x="491.6" y="599" width="150.8" height="129" rx="5"/>
  <text x="501.6" y="624" font-size="17">Camera and</text>
  <text x="501.6" y="645" font-size="17">microphone</text>
  <text x="501.6" y="666" font-size="17">notices;</text>
  <text x="501.6" y="687" font-size="17">on-device</text>
  <text x="501.6" y="708" font-size="17">minimisation</text>
  <rect class="panel" x="650.4" y="599" width="150.8" height="129" rx="5"/>
  <text x="660.4" y="624" font-size="17">Vendor SDK:</text>
  <text x="660.4" y="645" font-size="17">licence limits;</text>
  <text x="660.4" y="666" font-size="17">offline</text>
  <text x="660.4" y="687" font-size="17">revocation</text>
  <rect class="panel" x="809.2" y="599" width="150.8" height="129" rx="5"/>
  <text x="819.2" y="624" font-size="17">Weights are</text>
  <text x="819.2" y="645" font-size="17">extractable:</text>
  <text x="819.2" y="666" font-size="17">licence terms</text>
  <text x="819.2" y="687" font-size="17">and threat</text>
  <text x="819.2" y="708" font-size="17">model</text>
  <text class="mono muted" x="40" y="758" font-size="16">How it is adapted</text>
  <line class="axis" x1="40" y1="767" x2="960" y2="767"/>
  <text class="disp" x="40" y="804" font-size="18">Fine-tune</text>
  <rect class="panel" x="174" y="778" width="150.8" height="108" rx="5"/>
  <text x="184" y="803" font-size="17">Retrain is a</text>
  <text x="184" y="824" font-size="17">release: re-run</text>
  <text x="184" y="845" font-size="17">per-group floors</text>
  <rect class="panel" x="332.8" y="778" width="150.8" height="108" rx="5"/>
  <text x="342.8" y="803" font-size="17">Full red team;</text>
  <text x="342.8" y="824" font-size="17">safety-erosion</text>
  <text x="342.8" y="845" font-size="17">eval</text>
  <rect class="panel" x="491.6" y="778" width="150.8" height="108" rx="5"/>
  <text x="501.6" y="803" font-size="17">Likeness and</text>
  <text x="501.6" y="824" font-size="17">consent checks</text>
  <text x="501.6" y="845" font-size="17">on tuning media</text>
  <rect class="panel" x="650.4" y="778" width="150.8" height="108" rx="5"/>
  <text x="660.4" y="803" font-size="17">Vendor tuning</text>
  <text x="660.4" y="824" font-size="17">service: data</text>
  <text x="660.4" y="845" font-size="17">terms; your</text>
  <text x="660.4" y="866" font-size="17">own re-eval</text>
  <rect class="panel" x="809.2" y="778" width="150.8" height="108" rx="5"/>
  <text x="819.2" y="803" font-size="17">Compute log</text>
  <text x="819.2" y="824" font-size="17">against the</text>
  <text x="819.2" y="845" font-size="17">GPAI one-third</text>
  <text x="819.2" y="866" font-size="17">criterion</text>
  <text class="disp" x="40" y="920" font-size="18">RAG</text>
  <rect class="panel" x="174" y="894" width="150.8" height="129" rx="5"/>
  <text x="184" y="919" font-size="17">Not typical;</text>
  <text x="184" y="940" font-size="17">govern</text>
  <text x="184" y="961" font-size="17">feature-store</text>
  <text x="184" y="982" font-size="17">lineage instead</text>
  <rect class="panel" x="332.8" y="894" width="150.8" height="129" rx="5"/>
  <text x="342.8" y="919" font-size="17">Groundedness</text>
  <text x="342.8" y="940" font-size="17">eval; corpus</text>
  <text x="342.8" y="961" font-size="17">permissions;</text>
  <text x="342.8" y="982" font-size="17">poisoning</text>
  <text x="342.8" y="1003" font-size="17">checks</text>
  <rect class="panel" x="491.6" y="894" width="150.8" height="129" rx="5"/>
  <text x="501.6" y="919" font-size="17">Cross-modal</text>
  <text x="501.6" y="940" font-size="17">injection tests</text>
  <text x="501.6" y="961" font-size="17">on retrieved</text>
  <text x="501.6" y="982" font-size="17">media</text>
  <rect class="panel" x="650.4" y="894" width="150.8" height="129" rx="5"/>
  <text x="660.4" y="919" font-size="17">Your corpus,</text>
  <text x="660.4" y="940" font-size="17">their model:</text>
  <text x="660.4" y="961" font-size="17">retention and</text>
  <text x="660.4" y="982" font-size="17">no-training</text>
  <text x="660.4" y="1003" font-size="17">terms</text>
  <rect class="panel" x="809.2" y="894" width="150.8" height="129" rx="5"/>
  <text x="819.2" y="919" font-size="17">Every layer of</text>
  <text x="819.2" y="940" font-size="17">evidence is</text>
  <text x="819.2" y="961" font-size="17">yours to</text>
  <text x="819.2" y="982" font-size="17">produce</text>
  <text class="disp" x="40" y="1057" font-size="18">Agentic</text>
  <text class="disp" x="40" y="1079" font-size="18">wrapper</text>
  <rect class="panel" x="174" y="1031" width="150.8" height="129" rx="5"/>
  <text x="184" y="1056" font-size="17">Score triggers</text>
  <text x="184" y="1077" font-size="17">an action:</text>
  <text x="184" y="1098" font-size="17">human gate on</text>
  <text x="184" y="1119" font-size="17">adverse</text>
  <text x="184" y="1140" font-size="17">outcomes</text>
