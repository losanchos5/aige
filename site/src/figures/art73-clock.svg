<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 316" class="figc" role="img" aria-labelledby="fig-art73-t fig-art73-d">
  <title id="fig-art73-t">The Article 73 clock</title>
  <desc id="fig-art73-d">The Article 73 serious-incident reporting windows by incident class — 2, 10 and no later than 15 days — with the incident pipeline that meets them.</desc>

  <text class="mono muted" x="16" y="20" font-size="13.5">ARTICLE 73 · SERIOUS-INCIDENT REPORTING</text>

  <!-- Trigger -->
  <rect class="panel" x="108" y="30" width="144" height="30" rx="6"/>
  <text class="disp" x="180" y="50" font-size="14" text-anchor="middle">Serious incident</text>
  <line class="stroke-arrow" x1="180" y1="60" x2="180" y2="74"/>
  <path class="arrow" d="M174 74 h12 l-6 9 z"/>

  <!-- The one decision: classify (gate diamond) -->
  <path class="glyph" d="M180 78 l52 22 l-52 22 l-52 -22 z"/>
  <text class="mono" x="180" y="105" font-size="13" text-anchor="middle">Classify</text>
  <line class="stroke-arrow" x1="180" y1="122" x2="180" y2="134"/>
  <path class="arrow" d="M174 134 h12 l-6 9 z"/>

  <!-- Class → window -->
  <rect class="panel" x="8" y="140" width="344" height="118" rx="10"/>
  <text class="ink2" x="22" y="166" font-size="13.5">Widespread infringement</text>
  <rect class="cell-empty" x="252" y="150" width="90" height="26" rx="6" stroke="currentColor" stroke-width="1"/>
  <text class="disp" x="297" y="167" font-size="14" text-anchor="middle">2 days</text>
  <line class="rule" x1="20" y1="182" x2="340" y2="182"/>
  <text class="ink2" x="22" y="204" font-size="13.5">Death of a person</text>
  <rect class="cell-empty" x="252" y="188" width="90" height="26" rx="6" stroke="currentColor" stroke-width="1"/>
  <text class="disp" x="297" y="205" font-size="14" text-anchor="middle">10 days</text>
  <line class="rule" x1="20" y1="220" x2="340" y2="220"/>
  <text class="ink2" x="22" y="242" font-size="13.5">Otherwise</text>
  <rect class="cell-empty" x="192" y="226" width="150" height="26" rx="6" stroke="currentColor" stroke-width="1"/>
  <text class="disp" x="267" y="243" font-size="13.5" text-anchor="middle">no later than 15 days</text>

  <!-- The artefact that meets the windows -->
  <rect class="l5-bg" x="8" y="274" width="152" height="26" rx="6"/>
  <text class="l5-tx" x="18" y="291" font-size="13.5">Incident pipeline</text>
  <text class="ink2" x="170" y="291" font-size="13">Classify before you report.</text>
</svg>
