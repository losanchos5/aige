<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 540" class="figc" role="img" aria-labelledby="fig-procured-ai-control-t fig-procured-ai-control-d">
  <title id="fig-procured-ai-control-t">Where control moves when you buy</title>
  <desc id="fig-procured-ai-control-d">A procured system passes a due-diligence gate; then boundary evals and the controllable perimeter shrink, while inventory and collected supplier evidence grow.</desc>

  <text class="mono muted" x="16" y="20" font-size="13.5">Procured AI: the control budget moves</text>

  <!-- The system you did not train -->
  <rect class="panel" x="8" y="32" width="344" height="46" rx="8"/>
  <text class="disp" x="20" y="52" font-size="14.5">The vendor's system</text>
  <text class="ink2" x="20" y="70" font-size="13">SaaS with an LLM, an API model, a vendor agent</text>
  <line class="stroke-arrow" x1="180" y1="78" x2="180" y2="88"/>
  <path class="arrow" d="M174 88 h12 l-6 9 z"/>

  <!-- The one gate: due diligence (diamond) -->
  <path class="glyph" d="M180 100 l84 24 l-84 24 l-84 -24 z"/>
  <text class="mono" x="180" y="129" font-size="13" text-anchor="middle">Due diligence</text>
  <line class="stroke-arrow" x1="180" y1="148" x2="180" y2="160"/>
  <path class="arrow" d="M174 160 h12 l-6 9 z"/>

  <!-- Layer 02 grows -->
  <rect class="l2-band" x="8" y="172" width="344" height="62" rx="8" stroke-width="1"/>
  <rect class="l2-bg" x="18" y="181" width="243" height="22" rx="5"/>
  <text class="l2-tx" x="28" y="196" font-size="13.5">Layer 02 Inventory &amp; Transparency</text>
  <path class="glyph-fill" d="M18 224 l6 -10 l6 10 z"/>
  <text x="36" y="224" font-size="13">Grows: registry entry, owner and scope</text>

  <!-- Layer 03 shrinks -->
  <rect class="l3-band" x="8" y="242" width="344" height="62" rx="8" stroke-width="1"/>
  <rect class="l3-bg" x="18" y="251" width="290" height="22" rx="5"/>
  <text class="l3-tx" x="28" y="266" font-size="13.5">Layer 03 Evals &amp; Red Teaming as Evidence</text>
  <path class="glyph-fill" d="M18 284 l6 10 l6 -10 z"/>
  <text x="36" y="294" font-size="13">Shrinks: boundary evals, vendor's evidence</text>

  <!-- Layer 04 shrinks -->
  <rect class="l4-band" x="8" y="312" width="344" height="62" rx="8" stroke-width="1"/>
  <rect class="l4-bg" x="18" y="321" width="297" height="22" rx="5"/>
  <text class="l4-tx" x="28" y="336" font-size="13.5">Layer 04 Runtime Controls &amp; Observability</text>
  <path class="glyph-fill" d="M18 354 l6 10 l6 -10 z"/>
  <text x="36" y="364" font-size="13">Shrinks: scopes, identity, observed traffic</text>

  <!-- Layer 05 grows: the evidence you collect (document with a check) -->
  <rect class="l5-band" x="8" y="382" width="344" height="80" rx="8" stroke-width="1"/>
  <rect class="l5-bg" x="18" y="391" width="304" height="22" rx="5"/>
  <text class="l5-tx" x="28" y="406" font-size="13.5">Layer 05 Assurance &amp; Continuous Compliance</text>
  <path class="glyph" d="M328 425 h12 l5 5 v17 h-17 z"/>
  <path class="glyph" d="M340 425 v5 h5"/>
  <path class="glyph-check" d="M331 438 l3 3 l6 -7"/>
  <path class="glyph-fill" d="M18 434 l6 -10 l6 10 z"/>
  <text x="36" y="434" font-size="13">Grows: supplier docs, model card, AIBOM</text>
  <text class="ink2" x="36" y="452" font-size="13">Evidence you collect, not produce</text>

  <text class="ink2" x="16" y="488" font-size="13.5">The less of the model you own, the more of</text>
  <text class="ink2" x="16" y="506" font-size="13.5">your control budget moves from testing it</text>
  <text class="ink2" x="16" y="524" font-size="13.5">to bounding it and evidencing the supplier.</text>
</svg>
