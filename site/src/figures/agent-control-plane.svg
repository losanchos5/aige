<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 650" class="figc" role="img" aria-labelledby="fig-agent-control-plane-t fig-agent-control-plane-d">
  <title id="fig-agent-control-plane-t">The agent control plane</title>
  <desc id="fig-agent-control-plane-d">One tool call through the agent control plane: registry, identity, gateway, guardrail, checkpoint and breaker, with telemetry kept as evidence.</desc>

  <text class="mono muted" x="16" y="18" font-size="13.5">One tool call through the control plane</text>

  <!-- Registry (Layer 02, cylinder) -->
  <rect class="l2-band" x="24" y="28" width="176" height="44" rx="8"/>
  <ellipse class="glyph" cx="42" cy="40" rx="8" ry="3"/>
  <path class="glyph" d="M34 40 v15 a8 3 0 0 0 16 0 v-15"/>
  <text class="disp" x="58" y="46" font-size="14.5">Agent registry</text>
  <text class="ink2" x="58" y="63" font-size="13">owner, scope, expiry</text>
  <line class="stroke-arrow" x1="112" y1="72" x2="112" y2="84"/>
  <path class="arrow" d="M106 84 h12 l-6 9 z"/>
  <text class="mono muted" x="124" y="88" font-size="13">no entry, no credential</text>

  <!-- Identity issuer (Layer 04) -->
  <rect class="l4-band" x="24" y="96" width="176" height="44" rx="8"/>
  <text class="disp" x="36" y="114" font-size="14.5">Identity issuer</text>
  <text class="ink2" x="36" y="131" font-size="13">short-lived credential</text>
  <line class="stroke-arrow" x1="112" y1="140" x2="112" y2="152"/>
  <path class="arrow" d="M106 152 h12 l-6 9 z"/>

  <!-- The agent (hexagon) -->
  <rect class="panel" x="24" y="164" width="176" height="44" rx="8"/>
  <path class="glyph" d="M46 176 l9 5 v10 l-9 5 l-9 -5 v-10 z"/>
  <text class="disp" x="64" y="182" font-size="14.5">Agent</text>
  <text class="ink2" x="64" y="199" font-size="13">proposes a tool call</text>
  <line class="stroke-arrow" x1="112" y1="208" x2="112" y2="220"/>
  <path class="arrow" d="M106 220 h12 l-6 9 z"/>

  <!-- Tool gateway (Layer 04) -->
  <rect class="l4-band" x="24" y="232" width="176" height="44" rx="8"/>
  <text class="disp" x="36" y="250" font-size="14.5">Tool gateway</text>
  <text class="ink2" x="36" y="267" font-size="13">deny by default</text>
  <line class="stroke-arrow" x1="112" y1="276" x2="112" y2="288"/>
  <path class="arrow" d="M106 288 h12 l-6 9 z"/>

  <!-- Runtime guardrail with its failure posture (Layer 04) -->
  <rect class="l4-band" x="24" y="300" width="176" height="80" rx="8"/>
  <text class="disp" x="36" y="318" font-size="14.5">Runtime guardrail</text>
  <text class="ink2" x="36" y="335" font-size="13">policy check, every call</text>
  <text class="ink2" x="36" y="353" font-size="13">fails closed for pay,</text>
  <text class="ink2" x="36" y="369" font-size="13">delete, send, execute</text>
  <line class="stroke-arrow" x1="112" y1="380" x2="112" y2="390"/>
  <path class="arrow" d="M106 390 h12 l-6 9 z"/>

  <!-- Human checkpoint: the one gate (diamond, person glyph) -->
  <path class="l4-band" d="M112 400 l88 28 l-88 28 l-88 -28 z"/>
  <circle class="glyph" cx="112" cy="409" r="3.5"/>
  <path class="glyph" d="M105.5 421 a6.5 5.5 0 0 1 13 0"/>
  <text x="112" y="438" font-size="13.5" text-anchor="middle">Human checkpoint</text>
  <text class="mono muted" x="24" y="474" font-size="13">where stakes demand it</text>

  <!-- Circuit breaker, per agent, with its stop levels (Layer 04) -->
  <rect class="l4-band" x="240" y="232" width="112" height="182" rx="8"/>
  <text class="disp" x="250" y="252" font-size="14.5">Circuit</text>
  <text class="disp" x="250" y="269" font-size="14.5">breaker</text>
  <text class="ink2" x="250" y="287" font-size="13">per agent</text>
  <text class="mono muted" x="250" y="307" font-size="13">stop levels</text>
  <text x="250" y="324" font-size="13">task</text>
  <text x="250" y="339" font-size="13">scope</text>
  <text x="250" y="354" font-size="13">breaker</text>
  <text x="250" y="369" font-size="13">identity</text>
  <text x="250" y="384" font-size="13">class</text>
  <text x="250" y="399" font-size="13">degrade</text>
  <!-- breaker stops the gateway; budgets in the guardrail trip it -->
  <line class="stroke-arrow" x1="240" y1="254" x2="209" y2="254"/>
  <path class="arrow" d="M209 248 v12 l-9 -6 z"/>
  <text class="ink2" x="203" y="246" font-size="13">stops</text>
  <line class="stroke-arrow" x1="200" y1="340" x2="231" y2="340"/>
  <path class="arrow" d="M231 334 v12 l9 -6 z"/>
  <text class="ink2" x="203" y="332" font-size="13">trips</text>

  <!-- Out through your boundary -->
  <line class="stroke-arrow" x1="200" y1="428" x2="238" y2="428"/>
  <path class="arrow" d="M238 422 v12 l9 -6 z"/>
  <line class="stroke-arrow" x1="232" y1="416" x2="232" y2="512" stroke-dasharray="4 3"/>
  <text class="ink2" x="251" y="432" font-size="13">Tool, MCP server</text>
  <text class="ink2" x="251" y="448" font-size="13">or remote agent</text>
  <text class="mono muted" x="240" y="472" font-size="13">your boundary:</text>
  <text class="ink2" x="240" y="490" font-size="13">revoke what</text>
  <text class="ink2" x="240" y="506" font-size="13">you issued</text>

  <!-- Every control leaves a trace: telemetry kept as evidence (Layer 05) -->
  <path class="stroke-arrow" d="M24 254 H12 V548 H15 M24 340 H12 M24 428 H12"/>
  <path class="arrow" d="M15 542 v12 l9 -6 z"/>
  <rect class="l5-band" x="24" y="520" width="328" height="56" rx="10"/>
  <path class="glyph" d="M34 532 h12 l5 5 v17 h-17 z"/>
  <path class="glyph" d="M46 532 v5 h5"/>
  <path class="glyph-check" d="M37 545 l3 3 l6 -7"/>
  <text class="disp" x="60" y="542" font-size="14.5">Telemetry and evidence</text>
  <text class="ink2" x="60" y="561" font-size="13">identity, tool calls, verdicts, approvals</text>

  <!-- Legend: layers named exactly -->
  <rect class="l2-band" x="24" y="592" width="12" height="12" rx="2"/>
  <text x="44" y="603" font-size="13">Layer 02 Inventory &amp; Transparency</text>
  <rect class="l4-band" x="24" y="610" width="12" height="12" rx="2"/>
  <text x="44" y="621" font-size="13">Layer 04 Runtime Controls &amp; Observability</text>
  <rect class="l5-band" x="24" y="628" width="12" height="12" rx="2"/>
  <text x="44" y="639" font-size="13">Layer 05 Assurance &amp; Continuous Compliance</text>
</svg>
