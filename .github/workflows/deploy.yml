name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # Cache the pinned archify CLI so `npm run build` (prebuild → diagrams-build)
      # does not re-download the tarball on every run. `path` is repo-root relative.
      - name: Cache archify CLI
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: site/.archify
          key: archify-v2.16.0
      - run: npm run build
        env:
          # Owner adds a repository secret named CF_BEACON_TOKEN to activate
          # Cloudflare Web Analytics; empty → Base.astro renders no beacon.
          PUBLIC_CF_BEACON_TOKEN: ${{ secrets.CF_BEACON_TOKEN }}
          # Owner adds a repository secret named UMAMI_WEBSITE_ID (the website
          # created in the self-hosted Umami instance at admin.stocktcg.net)
          # to activate analytics; empty → Base.astro renders no script.
          PUBLIC_UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
      - name: Deploy
        uses: cloudflare/wrangler-action@da0e0dfe58b7a431659754fdf3f186c529afbe65 # v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: pages deploy dist --project-name aige --branch main
      # Post-deploy smoke test: the production site must serve each key page with
      # HTTP 200 and the expected marker string, or the deploy is flagged failed.
      - name: Post-deploy smoke test
        run: |
          set -euo pipefail
          marker='AI Governance Engineer'
          for path in / /thesis /bok/the-stack; do
            url="https://aigovernanceengineer.com${path}"
            echo "Checking ${url}"
            status=$(curl --silent --show-error --location \
              --retry 5 --retry-delay 10 --retry-all-errors \
              --output /tmp/smoke-body.html --write-out '%{http_code}' "${url}")
            if [ "${status}" != "200" ]; then
              echo "::error::${url} returned HTTP ${status}"
              exit 1
            fi
            if ! grep -qF "${marker}" /tmp/smoke-body.html; then
              echo "::error::Marker '${marker}' not found at ${url}"
              exit 1
            fi
          done
          echo "Smoke test passed."
      # IndexNow (Bing and Copilot, Yandex, Seznam, Naver): after a push to main,
      # submit the sitemap URLs so those engines recrawl without waiting. The key
      # is public by design and lives at site/public/<key>.txt. Best effort: a
      # failure here is logged as a warning and never fails the deploy.
      - name: Submit sitemap URLs to IndexNow
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          INDEXNOW_KEY: 9f39919d3ae4eac155054e1f1f03cdeb
          INDEXNOW_HOST: aigovernanceengineer.com
        run: |
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const host = process.env.INDEXNOW_HOST;
            const key = process.env.INDEXNOW_KEY;
            const xml = readFileSync("dist/sitemap-0.xml", "utf8");
            const urls = [...xml.matchAll(/<loc>([^<]+)<\/loc>/g)]
              .map((m) => m[1].trim().replace(/&amp;/g, "&"))
              .filter((u) => u.startsWith("https://" + host + "/"))
              .slice(0, 10000);
            const body = { host, key, keyLocation: "https://" + host + "/" + key + ".txt", urlList: urls };
            writeFileSync("/tmp/indexnow.json", JSON.stringify(body));
            console.log("IndexNow: submitting " + urls.length + " URLs");
          ' || { echo "::warning::IndexNow payload not built"; exit 0; }
          status=$(curl --silent --show-error --max-time 60 \
            --retry 3 --retry-delay 10 \
            --output /tmp/indexnow-body.txt --write-out '%{http_code}' \
            -X POST -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/indexnow.json \
            https://api.indexnow.org/indexnow) || status=error
          echo "IndexNow responded ${status}"
          case "${status}" in
            200|202) ;;
            *) echo "::warning::IndexNow submission returned ${status}"; cat /tmp/indexnow-body.txt || true ;;
          esac
