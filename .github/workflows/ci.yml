name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # full history so `git log` dates in reading.ts resolve
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # Cache the pinned archify CLI so `npm run build` (prebuild → diagrams-build)
      # does not re-download the tarball on every run. `path` is repo-root relative.
      - name: Cache archify CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/.archify
          key: archify-v2.16.0
      # `build` runs astro check + build, content-lint over dist, then Pagefind.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Default project excludes the purely-visual screenshot specs (see playwright.config.ts).
      - run: npm test -- --reporter=html
      # The axe sweep discovers routes from dist and asserts zero violations.
      - run: npm run test:a11y
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: site/playwright-report
          retention-days: 7
      # Lighthouse CI runs LAST: `lhci autorun` starts its own `astro preview`
      # server (see lighthouserc.cjs) and uses the runner's system Chrome, but its
      # collection wipes dist/pagefind, so no Playwright step may follow it.
      # Non-blocking: a score regression should not fail the build.
      - name: Lighthouse CI
        run: npm run lhci
        continue-on-error: true
