name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # full history so `git log` dates in reading.ts resolve
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # The regulatory monitor's unit tests (tools/reg-monitor, no network, no
      # dependencies): run from the repo root, before the site install. Node 22
      # takes a quoted glob, not a directory.
      - name: Regulatory monitor tests
        working-directory: .
        run: node --test 'tools/reg-monitor/test/*.test.mjs'
      - run: npm ci
      # Cache the pinned archify CLI so `npm run build` (prebuild → diagrams-build)
      # does not re-download the tarball on every run. `path` is repo-root relative.
      - name: Cache archify CLI
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: site/.archify
          key: archify-v2.16.0
      # `build` runs astro check + build, content-lint over dist, then Pagefind.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Default project excludes the purely-visual screenshot specs (see playwright.config.ts).
      - run: npm test -- --reporter=html
      # The axe sweep discovers routes from dist and asserts zero violations.
      - run: npm run test:a11y
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: site/playwright-report
          retention-days: 7
      # Lighthouse CI runs LAST: `lhci autorun` starts its own `astro preview`
      # server (see lighthouserc.cjs) and uses the runner's system Chrome, but its
      # collection wipes dist/pagefind, so no Playwright step may follow it.
      # Non-blocking: a score regression should not fail the build. The SEO
      # category's checks are mirrored as blocking assertions in
      # site/tests/seo-basics.spec.ts, which the `npm test` step above runs.
      - name: Lighthouse CI
        run: npm run lhci
        continue-on-error: true

  # The read-only MCP server (tools/mcp-server) has its own package and unit
  # tests (fixtures, no network). They run only when the server, the schemas it
  # bundles or this workflow changed; otherwise the job passes without work.
  mcp-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/mcp-server
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # the diff below needs the base commit
      - name: Changed paths
        id: changes
        working-directory: .
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qE '^(tools/mcp-server/|site/public/schemas/|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/mcp-server/package-lock.json
      - name: MCP server tests
        if: steps.changes.outputs.run == 'true'
        run: npm ci && npm test
