name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the run it supersedes; main runs to the end.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One build, shared by the test jobs below through an artifact. Besides dist,
  # the artifact carries what the prebuild writes under src/ (the diagram
  # manifest and SVGs, the figures and their render cache), which specs import
  # or check with figures-build --check. The public/ outputs are already in dist.
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # full history so `git log` dates in reading.ts resolve
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      # The regulatory monitor's unit tests (tools/reg-monitor, no network, no
      # dependencies): run from the repo root, before the site install. Node 22
      # takes a quoted glob, not a directory.
      - name: Regulatory monitor tests
        working-directory: .
        run: node --test 'tools/reg-monitor/test/*.test.mjs'
      - run: npm ci
      # Cache the pinned archify CLI so `npm run build` (prebuild → diagrams-build)
      # does not re-download the tarball on every run. `path` is repo-root relative.
      - name: Cache archify CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: site/.archify
          key: archify-v2.16.0
      # `build` runs astro check + build, content-lint over dist, then Pagefind.
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site-build
          path: |
            site/dist
            site/src/generated
            site/src/figures
            site/.figures-cache
          retention-days: 1
          include-hidden-files: true

  # Playwright suites against the shared build. `default` is the behavioural
  # suite (npm test); `a11y` is the axe sweep plus orp-a11y. Each is split in
  # shards that run on separate runners. On pull requests the axe sweep samples
  # the large data-filled groups (see tests/a11y.spec.ts); pushes to main set
  # A11Y_FULL=1 and sweep every page, without blocking the deploy.
  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: default, shard: 1, of: 2 }
          - { project: default, shard: 2, of: 2 }
          - { project: a11y, shard: 1, of: 4 }
          - { project: a11y, shard: 2, of: 4 }
          - { project: a11y, shard: 3, of: 4 }
          - { project: a11y, shard: 4, of: 4 }
    name: test (${{ matrix.project }} ${{ matrix.shard }}/${{ matrix.of }})
    defaults:
      run:
        working-directory: site
    env:
      A11Y_FULL: ${{ github.event_name == 'push' && '1' || '0' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # seo-infra.spec compares sitemap lastmod with git log dates
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site-build
          path: site
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.of }} --reporter=list,html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.shard }}
          path: site/playwright-report
          retention-days: 7

  # Lighthouse CI, in its own job so it no longer sits at the end of the test
  # chain. `lhci autorun` starts its own `astro preview` server (see
  # lighthouserc.cjs) and uses the runner's system Chrome. Non-blocking: a score
  # regression should not fail the build. The SEO category's checks are
  # mirrored as blocking assertions in site/tests/seo-basics.spec.ts.
  lighthouse:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site-build
          path: site
      - name: Lighthouse CI
        run: npm run lhci

  # The read-only MCP server (tools/mcp-server) has its own package and unit
  # tests (fixtures, no network). They run only when the server, the schemas it
  # bundles or this workflow changed; otherwise the job passes without work.
  mcp-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/mcp-server
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # the diff below needs the base commit
      - name: Changed paths
        id: changes
        working-directory: .
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qE '^(tools/mcp-server/|site/public/schemas/|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/mcp-server/package-lock.json
      - name: MCP server tests
        if: steps.changes.outputs.run == 'true'
        run: npm ci && npm test

  i18n-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/i18n
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # the diff below needs the base commit
      - name: Changed paths
        id: changes
        working-directory: .
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qE '^(tools/i18n/|i18n/|bok/|THESIS[.]md$|site/src/i18n/|[.]github/workflows/ci[.]yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/i18n/package-lock.json
      - name: Translation pipeline tests (offline)
        if: steps.changes.outputs.run == 'true'
        run: npm ci && npm test
