name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # `build` runs astro check + build, content-lint over dist, then Pagefind.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Skip the purely-visual screenshot spec; run every functional spec.
      - run: npm test -- --grep-invert "screenshot" --reporter=html
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: site/playwright-report
          retention-days: 7
