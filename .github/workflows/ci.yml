name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # full history so `git log` dates in reading.ts resolve
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      # Cache the pinned archify CLI so `npm run build` (prebuild → diagrams-build)
      # does not re-download the tarball on every run. `path` is repo-root relative.
      - name: Cache archify CLI
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: site/.archify
          key: archify-v2.16.0
      # `build` runs astro check + build, content-lint over dist, then Pagefind.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Default project excludes the purely-visual screenshot specs (see playwright.config.ts).
      - run: npm test -- --reporter=html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: site/playwright-report
          retention-days: 7
