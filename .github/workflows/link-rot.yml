name: Link rot

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Check external links across the prose and data files. Non-blocking:
      # `fail: false` means a dead link never fails the run; it is reported below.
      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: false
          output: ./lychee/report.md
          args: >-
            --max-concurrency 4
            --max-retries 3
            --retry-wait-time 2
            --accept 200..204,206,301,302,307,308
            --exclude-loopback
            THESIS.md
            README.md
            'bok/*.md'
            sources/SOURCES.md
            'site/src/data/*.ts'
      # Reuse a single open "Link rot report" issue instead of opening a new one
      # each week; empty output → create-issue-from-file opens the first one.
      - name: Find existing report issue
        if: steps.lychee.outputs.exit_code != 0
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --state open --search 'Link rot report in:title' \
            --json number,title \
            --jq 'map(select(.title == "Link rot report")) | .[0].number // ""' 2>/dev/null || true)
          echo "number=${number}" >> "$GITHUB_OUTPUT"
      - name: Create or update the report issue
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: Link rot report
          content-filepath: ./lychee/report.md
          issue-number: ${{ steps.find.outputs.number }}
          labels: link-rot
